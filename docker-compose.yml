services:
  jejune_docs_server:
    build:
      context: DockerContext
      args:
        INCLUDE_PDFS: "false"
      secrets:
        - git_credentials
        - catalog
    ports:
      - "8765:8765"
    # --- DEV_MODE override: uncomment to read docs from host volume ---
    # environment:
    #   DEV_MODE: "true"
    #   DEV_DOCS_MOUNT: /docs-mount
    # volumes:
    #   - ${JEJUNE_ROOT_DIR}:/docs-mount:ro

secrets:
  # git-credential-store lines, one per private repository (see jejune_cli CompGitAccess)
  git_credentials:
    file: ${GIT_CREDENTIALS_FILE:-/dev/null}
  catalog:
    file: ${CATALOG_FILE}
