<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jejune_docs_server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
    }

    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }

    #subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    #subtitle a { color: #4a8fc1; text-decoration: none; }
    #subtitle a:hover { text-decoration: underline; }

    table {
      border-collapse: collapse;
      width: 100%;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    thead tr { background: #2b3a4b; color: #fff; }
    th, td { padding: 0.55rem 0.9rem; text-align: left; font-size: 0.875rem; }
    th { font-weight: 600; letter-spacing: 0.03em; }
    td { border-top: 1px solid #eee; }
    tr:hover td { background: #f0f6ff; }

    td.name { font-family: monospace; font-size: 0.82rem; }
    td.name a { color: #2b3a4b; text-decoration: none; font-weight: 600; }
    td.name a:hover { text-decoration: underline; }

    td.url { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.url a { color: #4a8fc1; font-size: 0.8rem; text-decoration: none; }
    td.url a:hover { text-decoration: underline; }

    td.flag { text-align: center; }
    .yes { color: #2a9d5c; font-weight: 700; }
    .no  { color: #bbb; }

    .view-graph {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: #2a9d5c;
      border-radius: 3px;
      text-decoration: none;
      white-space: nowrap;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .view-graph:hover { background: #218c4f; }

    #status { font-size: 0.85rem; color: #888; margin-bottom: 1rem; }
    #error  { color: #c0392b; font-size: 0.85rem; margin-bottom: 1rem; }

    #md-mode-control {
      font-size: 0.82rem;
      color: #555;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    #md-mode-control label { cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <h1>jejune_docs_server</h1>
  <p id="subtitle">
    Catalog summary &mdash; <a href="/swagger">Swagger UI</a>
  </p>
  <p id="status">Loading catalog&hellip;</p>
  <p id="error" hidden></p>
  <div id="md-mode-control" hidden>
    <input type="checkbox" id="md-replace-toggle"
           onchange="setMdMode(this.checked ? 'replace' : 'append')">
    <label for="md-replace-toggle">Replace on open (close previous docs)</label>
  </div>

  <table id="catalog-table" hidden>
    <thead>
      <tr>
        <th>Name</th>
        <th>URL</th>
        <th>Markdown</th>
        <th>Sentences</th>
        <th>Turtle</th>
        <th>PDF</th>
      </tr>
    </thead>
    <tbody id="catalog-body"></tbody>
  </table>

  <script>
    function flag(value) {
      return value
        ? '<span class="yes" title="available">&#10003;</span>'
        : '<span class="no"  title="unavailable">&ndash;</span>';
    }

    function primaryLink(doc) {
      if (doc.has_sentences) return `/docs/${doc.name}/sentences`;
      if (doc.has_markdown)  return `/docs/${doc.name}/markdown`;
      if (doc.has_turtle)    return `/docs/${doc.name}/turtle`;
      return null;
    }

    function turtleCell(doc, kgUrl) {
      if (!doc.has_turtle) return '<span class="no" title="unavailable">&ndash;</span>';
      if (kgUrl) {
        const turtleUrl = encodeURIComponent(window.location.origin + `/docs/${doc.name}/turtle`);
        return `<a class="view-graph" href="${kgUrl}/?url=${turtleUrl}" target="_blank" rel="noopener">View Graph</a>`;
      }
      return '<span class="yes" title="available">&#10003;</span>';
    }

    let mdBrowserWindow = null;

    function getMdMode() {
      return localStorage.getItem('md_open_mode') || 'append';
    }

    function setMdMode(mode) {
      localStorage.setItem('md_open_mode', mode);
      document.getElementById('md-replace-toggle').checked = mode === 'replace';
    }

    async function openMarkdown(btn) {
      const { mdUrl, triggerUrl, markdownUrl, name } = btn.dataset;
      const solo = getMdMode() === 'replace';
      const soloParam = solo ? '&solo=1' : '';
      const openUrl = `${triggerUrl}/open?url=${markdownUrl}&name=${name}${soloParam}`;

      // Attempt trigger before focusing the other tab: if the markdown browser
      // tab is already loaded its trigger server responds immediately, while the
      // docs server tab still has focus (avoids background-tab timer throttling).
      let triggered = false;
      try {
        const r = await fetch(openUrl, { mode: 'cors' });
        if (r.ok) triggered = true;
      } catch (_) {}

      // Focus without navigation if the tab is already open; otherwise open fresh.
      // window.open(url, name) navigates the existing tab when code-server has
      // internally changed the URL (history.pushState), which reloads the extension
      // and kills the in-flight fetchAndOpen.
      if (mdBrowserWindow && !mdBrowserWindow.closed) {
        mdBrowserWindow.focus();
      } else {
        mdBrowserWindow = window.open(mdUrl + '/?folder=/config', 'markdown_browser');
      }
      if (triggered) return;

      // Tab was just opened: poll until the extension's trigger server is ready.
      for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, 500));
        try {
          const r = await fetch(openUrl, { mode: 'cors' });
          if (r.ok) return;
        } catch (_) {}
      }
    }

    function markdownCell(doc, mdUrl, triggerUrl) {
      if (!doc.has_markdown) return '<span class="no" title="unavailable">&ndash;</span>';
      if (triggerUrl) {
        const markdownUrl = encodeURIComponent(window.location.origin + `/docs/${doc.name}/markdown`);
        const encodedName = encodeURIComponent(doc.name);
        return `<button class="view-graph"
          data-md-url="${mdUrl}"
          data-trigger-url="${triggerUrl}"
          data-markdown-url="${markdownUrl}"
          data-name="${encodedName}"
          onclick="openMarkdown(this)">View Markdown</button>`;
      }
      if (mdUrl) {
        const markdownUrl = encodeURIComponent(window.location.origin + `/docs/${doc.name}/markdown`);
        const href = `${mdUrl}/?folder=/config#url=${markdownUrl}&name=${encodeURIComponent(doc.name)}`;
        return `<a class="view-graph" href="${href}" target="_blank" rel="noopener">View Markdown</a>`;
      }
      return '<span class="yes" title="available">&#10003;</span>';
    }

    async function loadCatalog() {
      const status = document.getElementById('status');
      const errEl  = document.getElementById('error');
      const table  = document.getElementById('catalog-table');
      const tbody  = document.getElementById('catalog-body');

      try {
        const [catalogResp, configResp] = await Promise.all([fetch('/catalog'), fetch('/config')]);
        if (!catalogResp.ok) throw new Error(`HTTP ${catalogResp.status}: ${catalogResp.statusText}`);
        const docs = await catalogResp.json();
        const cfg        = configResp.ok ? await configResp.json() : {};
        const kgUrl      = (cfg.kg_graph_viewer_url          || '').replace(/\/$/, '');
        const mdUrl      = (cfg.markdown_browser_url         || '').replace(/\/$/, '');
        const triggerUrl = (cfg.markdown_browser_trigger_url || '').replace(/\/$/, '');

        status.textContent = `${docs.length} document${docs.length === 1 ? '' : 's'} in catalog`;

        if (triggerUrl) {
          const modeCtrl = document.getElementById('md-mode-control');
          modeCtrl.hidden = false;
          document.getElementById('md-replace-toggle').checked = getMdMode() === 'replace';
        }

        for (const doc of docs) {
          const link = primaryLink(doc);
          const nameCell = link
            ? `<a href="${link}">${doc.name}</a>`
            : doc.name;

          const urlCell = doc.url
            ? `<a href="${doc.url}" target="_blank" rel="noopener">${doc.url}</a>`
            : '&ndash;';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="name">${nameCell}</td>
            <td class="url">${urlCell}</td>
            <td class="flag">${markdownCell(doc, mdUrl, triggerUrl)}</td>
            <td class="flag">${flag(doc.has_sentences)}</td>
            <td class="flag">${turtleCell(doc, kgUrl)}</td>
            <td class="flag">${flag(doc.has_pdf)}</td>
          `;
          tbody.appendChild(tr);
        }

        table.hidden = false;
      } catch (err) {
        status.hidden = true;
        errEl.textContent = `Failed to load catalog: ${err.message}`;
        errEl.hidden = false;
      }
    }

    loadCatalog();
  </script>
</body>
</html>
