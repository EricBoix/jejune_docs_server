<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jejune_docs_server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
    }

    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }

    #subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    #subtitle a { color: #4a8fc1; text-decoration: none; }
    #subtitle a:hover { text-decoration: underline; }

    table {
      border-collapse: collapse;
      width: 100%;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    thead tr { background: #2b3a4b; color: #fff; }
    th, td { padding: 0.55rem 0.9rem; text-align: left; font-size: 0.875rem; }
    th { font-weight: 600; letter-spacing: 0.03em; }
    td { border-top: 1px solid #eee; }
    tr:hover td { background: #f0f6ff; }

    td.name { font-family: monospace; font-size: 0.82rem; }
    td.name a { color: #2b3a4b; text-decoration: none; font-weight: 600; }
    td.name a:hover { text-decoration: underline; }

    .url-link {
      display: inline-block;
      padding: 0.1rem 0.35rem;
      font-size: 0.75rem;
      color: #4a8fc1;
      border: 1px solid #4a8fc1;
      border-radius: 3px;
      text-decoration: none;
      line-height: 1.4;
    }
    .url-link:hover { background: #4a8fc1; color: #fff; }

    .flag { text-align: center; }
    .yes { color: #2a9d5c; font-weight: 700; }
    .no  { color: #bbb; }

    .view-graph {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: #2a9d5c;
      border-radius: 3px;
      text-decoration: none;
      white-space: nowrap;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .view-graph:hover { background: #218c4f; }

    .extraction-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .extraction-row + .extraction-row { margin-top: 0.25rem; }

    .model-label {
      font-size: 0.7rem;
      color: #555;
      white-space: nowrap;
      min-width: 5rem;
    }

    .pill-pair { display: inline-flex; }

    .pill-left, .pill-right {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
    }
    .pill-left  { background: #4a8fc1; border-radius: 3px 0 0 3px; }
    .pill-right { background: #2a9d5c; border-radius: 0 3px 3px 0; }
    .pill-left:hover  { background: #3a7aaa; }
    .pill-right:hover { background: #218c4f; }

    #status { font-size: 0.85rem; color: #888; margin-bottom: 1rem; }
    #error  { color: #c0392b; font-size: 0.85rem; margin-bottom: 1rem; }

    #md-mode-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      margin-top: 0.25rem;
      font-size: 0.7rem;
      font-weight: normal;
      opacity: 0.85;
    }
    #md-mode-control label { cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <h1>jejune_docs_server</h1>
  <p id="subtitle">
    Catalog summary &mdash; <a href="/swagger">Swagger UI</a>
  </p>
  <p id="status">Loading catalog&hellip;</p>
  <p id="error" hidden></p>

  <table id="catalog-table" hidden>
    <thead>
      <tr>
        <th>Name</th>
        <th class="flag">Markdown<span id="md-mode-control" hidden><input type="checkbox" id="md-replace-toggle" onchange="setMdMode(this.checked ? 'replace' : 'append')"><label for="md-replace-toggle">replace</label></span></th>
        <th>Graphs</th>
        <th class="flag">PDF</th>
        <th class="flag">Source URL</th>
      </tr>
    </thead>
    <tbody id="catalog-body"></tbody>
  </table>

  <script>
    function flag(value) {
      return value
        ? '<span class="yes" title="available">&#10003;</span>'
        : '<span class="no"  title="unavailable">&ndash;</span>';
    }

    function primaryLink(doc) {
      if (doc.has_graph_extractions) return `/docs/${doc.name}/graphs`;
      if (doc.has_markdown)          return `/docs/${doc.name}/markdown`;
      return null;
    }

    function graphsCell(doc, kgUrl) {
      if (!doc.has_graph_extractions) return '<span class="no" title="unavailable">&ndash;</span>';
      const extractions = (doc.graph_extractions || []).filter(ex => ex.turtle_file);
      if (!extractions.length) return '<span class="no" title="unavailable">&ndash;</span>';

      const groups = new Map();
      for (const ex of extractions) {
        const model = ex.model_name || '';
        if (!groups.has(model)) groups.set(model, []);
        groups.get(model).push(ex);
      }

      const origin = window.location.origin;
      return [...groups.entries()].map(([model, exList]) => {
        const pills = exList.map(ex => {
          const chunkUrl  = `${origin}/docs/${doc.name}/graphs/${encodeURIComponent(ex.model_name)}/${encodeURIComponent(ex.chunk_short_name)}/chunks`;
          const turtleUrl = `${origin}/docs/${doc.name}/graphs/${encodeURIComponent(ex.model_name)}/${encodeURIComponent(ex.chunk_short_name)}/turtle`;
          const kgHref    = kgUrl ? `${kgUrl}?url=${encodeURIComponent(turtleUrl)}` : turtleUrl;
          return `<span class="pill-pair">` +
            `<a class="pill-left"  href="${chunkUrl}" target="_blank" rel="noopener">${ex.chunk_short_name}</a>` +
            `<a class="pill-right" href="${kgHref}"   target="_blank" rel="noopener">KG</a>` +
            `</span>`;
        }).join(' ');
        return `<div class="extraction-row">` +
          `<span class="model-label">${model}</span>${pills}` +
          `</div>`;
      }).join('');
    }

    function pdfCell(doc) {
      if (!doc.has_pdf) return '<span class="no" title="unavailable">&ndash;</span>';
      return `<a class="view-graph" href="/docs/${doc.name}/pdf" target="_blank" rel="noopener">View PDF</a>`;
    }

    let mdBrowserWindow = null;

    function getMdMode() {
      return localStorage.getItem('md_open_mode') || 'append';
    }

    function setMdMode(mode) {
      localStorage.setItem('md_open_mode', mode);
      document.getElementById('md-replace-toggle').checked = mode === 'replace';
    }

    async function openMarkdown(btn) {
      const { mdUrl, triggerUrl, markdownUrl, name } = btn.dataset;
      const solo = getMdMode() === 'replace';
      const soloParam = solo ? '&solo=1' : '';
      const fetchUrl     = `${triggerUrl}/fetch?url=${markdownUrl}&name=${name}`;
      const highlightUrl = `${triggerUrl}/highlight?file=/config/docs-server/${name}.md${soloParam}`;

      async function tryTrigger() {
        const fr = await fetch(fetchUrl, { mode: 'cors' });
        if (!fr.ok) return false;
        const hr = await fetch(highlightUrl, { mode: 'cors' });
        return hr.ok;
      }

      // Attempt trigger before focusing the other tab: if the markdown browser
      // tab is already loaded its trigger server responds immediately, while the
      // docs server tab still has focus (avoids background-tab timer throttling).
      let triggered = false;
      try { triggered = await tryTrigger(); } catch (_) {}

      // Focus without navigation if the tab is already open; otherwise open fresh.
      // window.open(url, name) navigates the existing tab when code-server has
      // internally changed the URL (history.pushState), which reloads the extension
      // and kills the in-flight fetchAndOpen.
      if (mdBrowserWindow && !mdBrowserWindow.closed) {
        mdBrowserWindow.focus();
      } else {
        mdBrowserWindow = window.open(mdUrl + '/?folder=/config', 'markdown_browser');
      }
      if (triggered) return;

      // Tab was just opened: poll until the extension's trigger server is ready.
      for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, 500));
        try { if (await tryTrigger()) return; } catch (_) {}
      }
    }

    function markdownCell(doc, mdUrl, triggerUrl) {
      if (!doc.has_markdown) return '<span class="no" title="unavailable">&ndash;</span>';
      if (triggerUrl) {
        const markdownUrl = encodeURIComponent(window.location.origin + `/docs/${doc.name}/markdown`);
        const encodedName = encodeURIComponent(doc.name);
        return `<button class="view-graph"
          data-md-url="${mdUrl}"
          data-trigger-url="${triggerUrl}"
          data-markdown-url="${markdownUrl}"
          data-name="${encodedName}"
          onclick="openMarkdown(this)">View Markdown</button>`;
      }
      return `<a class="view-graph" href="/docs/${doc.name}/markdown" target="_blank" rel="noopener">View</a>`;
    }

    async function loadCatalog() {
      const status = document.getElementById('status');
      const errEl  = document.getElementById('error');
      const table  = document.getElementById('catalog-table');
      const tbody  = document.getElementById('catalog-body');

      try {
        const [catalogResp, configResp, projectLinkResp] = await Promise.all([
          fetch('/catalog'), fetch('/config'), fetch('/project-link'),
        ]);
        if (!catalogResp.ok) throw new Error(`HTTP ${catalogResp.status}: ${catalogResp.statusText}`);
        const docs = await catalogResp.json();
        const cfg         = configResp.ok ? await configResp.json() : {};
        const projectLink = projectLinkResp.ok ? (await projectLinkResp.json()).link || '' : '';
        const kgUrl      = (cfg.kg_graph_viewer_url          || '').replace(/\/$/, '');
        const mdUrl      = (cfg.markdown_browser_url         || '').replace(/\/$/, '');
        const triggerUrl = (cfg.markdown_browser_trigger_url || '').replace(/\/$/, '');

        status.textContent = `${docs.length} document${docs.length === 1 ? '' : 's'} in catalog`;

        if (triggerUrl) {
          const modeCtrl = document.getElementById('md-mode-control');
          modeCtrl.hidden = false;
          document.getElementById('md-replace-toggle').checked = getMdMode() === 'replace';
        }

        for (const doc of docs) {
          const link = primaryLink(doc);
          const jePrefix = 'jejune_doc_';
          const hasPrefix = doc.name.startsWith(jePrefix);
          const shortName = hasPrefix ? doc.name.slice(jePrefix.length) : doc.name;
          let nameCell;
          if (hasPrefix) {
            const prefixEl = projectLink
              ? `<a href="${projectLink}" target="_blank" rel="noopener">>&lt;</a>`
              : `>&lt;`;
            const nameEl = link ? `<a href="${link}">${shortName}</a>` : shortName;
            nameCell = `${prefixEl} ${nameEl}`;
          } else {
            nameCell = link ? `<a href="${link}">${doc.name}</a>` : doc.name;
          }

          const urlCell = doc.url
            ? `<a class="url-link" href="${doc.url}" target="_blank" rel="noopener" title="${doc.url}">&#8599;</a>`
            : '<span class="no">&ndash;</span>';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="name">${nameCell}</td>
            <td class="flag">${markdownCell(doc, mdUrl, triggerUrl)}</td>
            <td style="vertical-align:middle; padding: 0.35rem 0.9rem;">${graphsCell(doc, kgUrl)}</td>
            <td class="flag">${pdfCell(doc)}</td>
            <td class="flag">${urlCell}</td>
          `;
          tbody.appendChild(tr);
        }

        table.hidden = false;
      } catch (err) {
        status.hidden = true;
        errEl.textContent = `Failed to load catalog: ${err.message}`;
        errEl.hidden = false;
      }
    }

    loadCatalog();
  </script>
</body>
</html>
